            { q: "Prabhas character in 'Salaar'?", a: ["Deva", "Vardha", "Billa"], c: "Deva" },
            { q: "Ultimate Rank?", a: ["Rebel Legend", "Fan", "Noob"], c: "Rebel Legend" }
        ];

        let currentQ = 0, score = 0, level = 1;
        const ranks = ["Fan", "Junior Artist", "Side Actor", "Comedian", "Villain", "Hero", "Super Star", "Mega Star", "Global Star", "REBEL LEGEND"];

        function speak(text) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            msg.voice = voices.find(v => v.name.includes('India') || v.name.includes('Male')) || voices[0];
            msg.pitch = 0.75;
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function startQuiz() {
            currentQ = 0; score = 0; level = 1;
            loadQuestion();
        }

        function loadQuestion() {
            const container = document.getElementById("options-container");
            const feedbackDiv = document.getElementById("feedback");
            feedbackDiv.innerText = "";

            if (currentQ > 0 && currentQ % 10 === 0 && (currentQ / 10) === level) {
                levelUp();
                return;
            }

            if (currentQ < quizData.length) {
                const data = quizData[currentQ];
                document.getElementById("level-display").innerText = "LEVEL " + level;
                document.getElementById("rank-display").innerText = "Rank: " + ranks[level-1];
                document.getElementById("q-text").innerText = (currentQ + 1) + ". " + data.q;
                
                speak(data.q);

                let shuffledOptions = shuffle([...data.a]);
                container.innerHTML = "";
                shuffledOptions.forEach(opt => {
                    const btn = document.createElement("button");
                    btn.className = "option-btn";
                    btn.innerText = opt;
                    btn.onclick = () => checkAnswer(opt, data.c);
                    container.appendChild(btn);
                });
            } else {
                showEnd();
            }
        }

        function checkAnswer(selected, correct) {
            const feedbackDiv = document.getElementById("feedback");
            if (selected === correct) {
                score++;
                feedbackDiv.style.color = "#00ff00";
                feedbackDiv.innerText = "Jai Maahishmathi!";
                speak("Correct! Jai Maahishmathi!");
            } else {
                feedbackDiv.style.color = "#ffff00";
                feedbackDiv.innerText = "Don't worry, Darling...";
                speak("Wrong! Don't worry, Darling.");
            }
            currentQ++;
            document.getElementById("score-board").innerText = "Total Score: " + score;
            setTimeout(loadQuestion, 2000);
        }

        function levelUp() {
            level++;
            speak("Level up! You are now a " + ranks[level-1]);
            document.getElementById("options-container").innerHTML = `
                <h2 style="color:gold;">LEVEL COMPLETED!</h2>
                <p>New Rank: ${ranks[level-1]}</p>
                <button class="option-btn" style="background:white; color:#aa0000" onclick="loadQuestion()">CONTINUE HUNT</button>
            `;
        }

        function showEnd() {
            speak("Mission complete. You are a true Rebel Legend. Stay happy, Darling.");
            document.getElementById("quiz-box").innerHTML = `
                <h1>MISSION COMPLETE</h1>
                <h2>Final Rank: ${ranks[9]}</h2>
                <p style="font-size:24px;">Score: ${score}/100</p>
                <button class="option-btn" style="background:white; color:#aa0000" onclick="location.reload()">REPLAY</button>
            `;
        }
